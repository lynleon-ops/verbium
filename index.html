@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap');

:root {
  --bg:#f6f8fa; --bg2:#ffffff; --bg3:#eaeef2; --ink:#1f2328; --ink50:#636c76; --ink30:#8c959f;
  --gold:#0969da; --gold-lt:rgba(9,105,218,.1); --rust:#d1242f; --rust-lt:rgba(209,36,47,.08);
  --border:#d0d7de; --border-md:#afb8c1;
  --shadow-sm:0 1px 3px rgba(31,35,40,.12); --shadow-lg:0 8px 24px rgba(140,149,159,.2);
  --th-bg:#1f2328; --radius:6px;
  --green:#1a7f37;
  --type-title:.78rem; --type-label:.65rem; --type-body:.88rem;
  --weight-title:700; --weight-body:500; --tracking-title:.1em;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg3);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:stretch;padding:0}
.app{width:100%;max-width:1360px;display:flex;flex-direction:column;min-height:0;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border)}

/* Two-column layout */
.app-body{flex:1;display:flex;min-height:0;overflow:hidden}

/* Left sidebar */
.sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:10px;border-bottom:1px solid var(--border)}
.sidebar-new-btn{display:flex;align-items:center;gap:8px;width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--ink);padding:9px 12px;font-size:.8rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow-sm)}
.sidebar-new-btn:hover{border-color:var(--gold);color:var(--gold)}
.sidebar-sort{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border)}
.sidebar-sort-btn{flex:1;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--ink50);font-size:.66rem;padding:4px 6px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.sidebar-sort-btn:hover{border-color:var(--gold);color:var(--ink)}
.sidebar-sort-btn.active{background:var(--gold);border-color:var(--gold);color:#fff}
.sidebar-list{flex:1;overflow-y:auto;padding:8px}
.sidebar-card{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-bottom:6px;cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .15s}
.sidebar-card:hover{border-color:var(--gold)}
.sidebar-card.active{border-color:var(--gold);background:var(--gold-lt)}
.sidebar-card-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sidebar-card-title{font-size:.82rem;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sidebar-card-sub{font-size:.62rem;color:var(--ink50);margin-top:3px}
.sidebar-card-del{background:transparent;border:none;color:var(--ink50);cursor:pointer;padding:3px;border-radius:4px;line-height:0;font-size:inherit;font-weight:normal;letter-spacing:normal;text-transform:none;min-width:0}
.sidebar-card-del:hover{color:var(--rust);background:var(--rust-lt)}
.sidebar-empty{color:var(--ink50);font-size:.78rem;padding:16px 8px;line-height:1.6;text-align:center}
.sidebar-folder{padding:10px;border-top:1px solid var(--border);color:var(--ink50)}
.sidebar-folder button{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;min-height:44px;padding:10px 12px;width:100%;text-transform:none;letter-spacing:0;font-weight:600}
.folder-icon{font-size:20px;line-height:1;flex:0 0 auto}
.folder-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Right main panel */
.main-panel{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* Tab content panels */
.tab-panels{flex:1;min-height:0;overflow:hidden;position:relative}
.tab-panel{display:none;flex-direction:column;gap:8px;padding:16px;height:100%;min-height:0;overflow:hidden}
.tab-panel.active{display:flex}

/* Empty state */
.editor-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink50);text-align:center;padding:40px}
.editor-empty svg{opacity:.3}
.editor-empty p{margin:0;font-size:.88rem}

/* Header */
.header{background:var(--bg2);border:1px solid var(--border);border-top:3px solid var(--gold);padding:0;overflow:visible}



/* Input box */
.box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;min-width:0}
.editor-box{flex:0 0 auto}
.results{display:none;flex:1 1 auto;min-height:0;overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable;flex-direction:column;gap:8px;padding-right:2px}
.results.is-visible{display:flex}
.section-flush{padding:0}
.section-heading{padding:14px 20px}
.section-content{padding:16px 24px}
.results-table{background:var(--bg2);border:1px solid var(--border);width:100%;overflow:hidden}
.syl-table-wrap{overflow-x:auto}
.syl-table{width:100%;min-width:700px;border-collapse:collapse;font-size:14px;table-layout:fixed}
h2{color:var(--ink);font-size:var(--type-title);font-weight:var(--weight-title);text-transform:uppercase;letter-spacing:var(--tracking-title);line-height:1.35;margin:0 0 14px;display:block}
textarea{width:100%;height:160px;min-height:160px;resize:none;background:var(--bg2);border:1px solid var(--border);padding:16px;color:var(--ink);font:inherit;font-size:.95rem;line-height:1.6;outline:none}
textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-lt)}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
.status{min-height:18px;padding-top:8px;font-size:12px;letter-spacing:.04em;color:var(--ink50)}

/* Buttons */
button{border-radius:2px!important;border:1px solid var(--border);background:var(--bg2);color:var(--ink);padding:9px 24px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
button:hover:not(:disabled):not(.btn-primary):not(.btn-save){background:var(--bg)}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--gold);color:#fff;border-color:var(--gold);transition:background .2s}
.btn-primary:hover{background:#3d2e08}
.btn-save{background:#f97316;color:#fff;border-color:#f97316;transition:background .2s,border-color .2s,transform .1s}
.btn-save:hover{background:#ea580c;border-color:#ea580c}
.btn-save:active{background:#c2410c;border-color:#c2410c;transform:scale(.98)}
/* Metrics grid */
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.metric-card{background:rgba(255,255,255,.92);box-shadow:var(--shadow-sm);padding:14px}
.metric-card:nth-child(even){background:rgba(240,236,228,.65)}
.metric-label{color:var(--ink50);font-size:var(--type-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.metric-value{margin-top:6px;color:var(--gold);font-size:1rem;font-weight:700;line-height:1.25}

/* Bars */
.bars-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.bars{height:280px;display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding-bottom:4px}
.bar-item{display:flex;min-width:44px;flex:1 0 44px;flex-direction:column;align-items:center;gap:4px}
.bar-area{height:180px;width:100%;display:flex;align-items:flex-end}
.bar-fill{width:100%;min-height:4px;background:var(--gold)}
.bar-top-num{font-size:11px;font-weight:700;color:var(--ink50)}

.bar-lbl{font-size:9px;font-weight:600;text-align:center;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* Table */

table{width:100%;min-width:980px;table-layout:fixed;border-collapse:separate;border-spacing:0;text-align:left;font-size:14px}
.td-divided{word-break:break-word;white-space:normal;max-width:380px}
.syl-line{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;white-space:normal;line-height:1.25}
.syl-readable{width:100%;margin-bottom:4px;color:var(--ink);font-size:.92rem;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.syl-cell{display:inline-grid;grid-template-rows:auto auto;min-width:42px;border:1px solid var(--border);background:var(--bg2);text-align:center;overflow:hidden}
.syl-cell.is-tonic{border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.syl-index{padding:2px 6px;background:var(--bg);color:var(--ink50);font-size:.55rem;font-weight:700;letter-spacing:.06em}
.syl-text{padding:6px 8px;color:var(--ink);font-size:.88rem;font-weight:600}
.syl-cell.is-tonic .syl-text{color:var(--rust)}
.syl-cesura{display:inline-flex;align-items:center;color:var(--rust);font-size:1.35rem;font-weight:700;padding:0 2px}
.syl-legend{width:100%;margin-top:2px;color:var(--ink50);font-size:.58rem;letter-spacing:.02em}
.rhyme-summary{margin:0 16px 16px;padding:14px 16px;border-left:3px solid var(--rust);background:var(--rust-lt);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 16px}
.rhyme-summary-label{color:var(--ink50);font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.rhyme-summary-pattern{color:var(--rust);font-size:1.15rem;font-weight:800;letter-spacing:.16em;overflow-wrap:anywhere}
.rhyme-summary-note{grid-column:1/-1;color:var(--ink50);font-size:.68rem}
.scan-primary{background:var(--bg2);border:0;padding:18px 20px}
.scan-primary h2{margin:0 0 14px}
.scan-primary-pattern{margin-bottom:12px;padding:9px 12px;background:rgba(28,26,22,.035);color:var(--ink50);font-size:var(--type-body);font-weight:600;letter-spacing:.04em;line-height:1.45}
.scan-primary-list{display:grid;gap:10px}
.scan-primary-head,.scan-primary-row{display:grid;grid-template-columns:minmax(280px,3fr) 72px minmax(115px,.8fr);gap:12px;align-items:center}
.scan-primary-head{padding:9px 12px;background:var(--th-bg);color:var(--bg);font-size:var(--type-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.35}
.scan-primary-row{padding:12px;border:1px solid rgba(28,26,22,.08);background:rgba(28,26,22,.018)}
.scan-primary-division{color:var(--ink50);font-size:var(--type-body);font-weight:var(--weight-body);line-height:1.65;overflow-wrap:anywhere}
.scan-primary-count{color:var(--gold);font-size:var(--type-body);font-weight:700;text-align:center}
.scan-primary-rhyme{color:var(--rust);font-size:var(--type-body);font-weight:700;text-align:center}
.scan-primary-policy{grid-column:1/-1;color:var(--ink50);font-size:var(--type-label);font-weight:500;line-height:1.4}
@media(max-width:768px){
  .scan-primary-head{display:none}
  .scan-primary-row{grid-template-columns:1fr 1fr;gap:8px}
  .scan-primary-division{grid-column:1/-1}
  .scan-primary-division::before{content:'División: ';color:var(--ink50);font-size:.65rem;font-weight:700;text-transform:uppercase}
  .scan-primary-count::before{content:'Sílabas: ';color:var(--ink50);font-size:.62rem}
  .scan-primary-rhyme::before{content:'Patrón de rima: ';color:var(--ink50);font-size:.62rem}
  .scan-primary-policy{grid-column:1/-1}
}
thead th{background:var(--th-bg);color:var(--bg);border:0;padding:12px 16px;font-size:var(--type-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.35}
tbody td{border:0;padding:16px;vertical-align:top}
tbody tr{background:rgba(255,255,255,.92)}
tbody tr:nth-child(even){background:rgba(240,236,228,.55)}
tbody tr:hover{background:var(--rust-lt)}



/* Footer */
.footer{background:var(--bg2);border:1px solid var(--border);border-bottom:2px solid var(--gold);padding:16px 20px;font-size:13px;letter-spacing:.04em;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--ink50)}
.footer-right{margin-left:auto;display:flex;align-items:center;gap:12px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--th-bg);color:var(--bg);padding:10px 20px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:180px 16px 0;background:rgba(0,0,0,.2)}
.modal.hidden{display:none}
.modal-card{width:100%;max-width:340px;border:1px solid var(--border-md);background:var(--bg2);padding:16px;box-shadow:0 25px 50px rgba(0,0,0,.25)}
.modal-card h2{margin:0 0 8px;color:var(--ink);font-size:12px}
.modal-card p{margin:0 0 12px;color:var(--ink50);font-size:12px}
.modal-card input{width:100%;border:1px solid var(--border-md);background:var(--bg2);color:var(--ink);padding:9px 12px;font-size:14px;outline:none}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* Responsive */
@media(max-width:900px){.metrics-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.tab-panel{padding:10px}.box{padding:16px}.metrics-grid{grid-template-columns:1fr 1fr}.actions button{flex:1}.results{scrollbar-gutter:auto}}

/* ── Mobile sidebar overlay & toggle ───────────────────── */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.sidebar-overlay.show{opacity:1;pointer-events:auto}
.sidebar-close-btn{display:none;background:none;border:none;color:var(--ink50);cursor:pointer;padding:4px;border-radius:4px;line-height:0;font-size:inherit}
.sidebar-close-btn:hover{color:var(--rust);background:var(--rust-lt)}
.menu-toggle{display:none;align-items:center;justify-content:center;width:36px;height:36px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--ink);cursor:pointer;font-size:1.1rem;padding:0;margin-right:8px;flex-shrink:0}
.menu-toggle:hover{border-color:var(--gold);color:var(--gold)}

@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:50;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);border-right:none;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-close-btn{display:block;position:absolute;top:10px;right:10px;z-index:10}
  .menu-toggle{display:flex}

<script>
/* ── Constants ──────────────────────────────────────────── */
const VOWELS        = new Set('aeiouáéíóúüŵẅ');
const STRONG        = new Set('aeoáéó');
const WEAK          = new Set('iuüŵẅ');
const WEAK_ACCENT   = new Set('íú');
const UNACCENT_MAP  = {á:'a',é:'e',í:'i',ó:'o',ú:'u',ü:'u'};
const ONSET_CLUSTERS= new Set(['bl','br','cl','cr','dr','fl','fr','gl','gr','pl','pr','tr','ch','ll','rr','qŵ','gŵ','gẅ']);
const VERSE_NAMES   = {2:'Bisílabo',3:'Trisílabo',4:'Tetrasílabo',5:'Pentasílabo',6:'Hexasílabo',7:'Heptasílabo',8:'Octosílabo',9:'Eneasílabo',10:'Decasílabo',11:'Endecasílabo',12:'Dodecasílabo',14:'Alejandrino'};
const STRIP_PUNCT   = /[¿¡.,;:!?"«»""''()\[\]\-–—]/g;
const REGULAR_COUNTS= new Set([8, 11, 14]);
const STORAGE_KEY   = 'verbium_poems';

/* ── Tabs engine ─────────────────────────────────────────── */
let tabs = [];       // {id, name, poem, text, dirty}
let activeTabId = null;
let nextTabId = 1;

function getActiveTab() { return tabs.find(t=>t.id===activeTabId)||null; }

function setResultsVisible(element, visible) {
  if (element) element.classList.toggle('is-visible', visible);
}

function openNewTab(poem=null) {
  const id = nextTabId++;
  const name = poem ? poem.name : 'Sin título';
  const tab = { id, name, poem, text: poem?poem.text:'', dirty:false };
  tabs.push(tab);
  return tab;
}

function activateTab(id) {
  activeTabId = id;
  // Hide all panels
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  // Show selected
  const panel = document.getElementById('panel-'+id);
  if (panel) panel.classList.add('active');
  // Hide empty state
  const empty = document.getElementById('editor-empty');
  if (empty) empty.style.display = tabs.length ? 'none' : 'flex';
  // Update sidebar highlight
  renderSidebar();
}

function closeTab(id) {
  const tab = tabs.find(t=>t.id===id);
  if (tab && tab.dirty) {
    if (!confirm('¿Cerrar "'+tab.name+'" sin guardar?')) return;
  }
  tabs = tabs.filter(t=>t.id!==id);
  // Remove DOM elements
  const panel = document.getElementById('panel-'+id);
  if (panel) panel.remove();
  // Activate another tab
  if (activeTabId === id) {
    activeTabId = tabs.length ? tabs[tabs.length-1].id : null;
    if (activeTabId) activateTab(activeTabId);
    else {
      const empty = document.getElementById('editor-empty');
      if (empty) empty.style.display = 'flex';
    }
  }
  renderSidebar();
}

function createTabPanel(tab) {
  const existing = document.getElementById('panel-'+tab.id);
  if (existing) return;
  const panel = document.createElement('article');
  panel.className = 'tab-panel';
  panel.id = 'panel-'+tab.id;
  panel.innerHTML = `
    <div class="box editor-box">
      <h2>Escribe o pega tu poema</h2>
      <textarea id="ta-${tab.id}" placeholder="Pega o escribe aquí tu poema...">${escHtml(tab.text)}</textarea>
      <div class="status">Versos: <span id="vc-${tab.id}">0</span></div>
      <div class="actions">
        <button onclick="analyzeActiveTab()">Analizar →</button>
        <button onclick="clearActiveTab()">Limpiar</button>
        <button onclick="copyActiveTab()">Copiar</button>
        <button class="btn-save" style="margin-left:auto" onclick="saveActiveTab()">Guardar</button>
      </div>
    </div>
    <section id="results-${tab.id}" class="results" aria-label="Resultados del análisis">
      <div class="scan-primary" id="sv-${tab.id}">
        <h2>División en sílabas y patrón de rimas</h2>
        <div class="scan-primary-list"><div class="scan-primary-row"><span>Pulsa Analizar para ver la división.</span></div></div>
      </div>
      <div class="box section-flush">
        <div class="section-heading"><h2 style="margin:0">Métricas Generales</h2></div>
        <div class="section-content"><div class="metrics-grid" id="mg-${tab.id}"></div></div>
      </div>
      <div class="results-table">
        <div class="section-heading"><h2 style="margin:0">División Silábica</h2></div>
        <div class="rhyme-summary" aria-live="polite">
          <span class="rhyme-summary-label">Patrón de rimas</span>
          <strong class="rhyme-summary-pattern" id="rp-${tab.id}">—</strong>
          <small class="rhyme-summary-note">La misma letra identifica versos que riman; — indica verso sin correspondencia.</small>
        </div>
        <div class="syl-table-wrap">
          <table class="syl-table">
            <thead><tr>
              <th style="width:3rem">#</th>
              <th style="width:32%">Verso</th>
              <th style="width:38%">División silábica</th>
              <th style="width:5rem">Sílabas</th>
              <th style="width:4rem">Rima</th>
            </tr></thead>
            <tbody id="rb-${tab.id}"></tbody>
          </table>
        </div>
      </div>
      <div class="bars-box">
        <h2>Gráfico de medida por verso</h2>
        <div class="bars" id="bc-${tab.id}"></div>
      </div>
    </section>`;

  // Append panel to DOM first
  document.getElementById('tab-panels').appendChild(panel);

  // Wait for DOM to update before attaching events
  setTimeout(() => {
    const ta = document.getElementById('ta-'+tab.id);
    if (!ta) return;
    ta.addEventListener('input', () => {
      tab.text = ta.value;
      tab.dirty = true;
      const lines = ta.value.split('\n').filter(l=>l.trim()).length;
      const vc = document.getElementById('vc-'+tab.id);
      if (vc) vc.textContent = lines;
      // Auto-analyze
      debounceAnalyze();
    });
    ta.addEventListener('keydown', e => { if(e.key==='Enter'&&e.ctrlKey) analyzePoem(); });
    // Set initial verse count
    const lines = tab.text.split('\n').filter(l=>l.trim()).length;
    const vc = document.getElementById('vc-'+tab.id);
    if (vc) vc.textContent = lines;
    // Set textarea value
    ta.value = tab.text || '';
  }, 0);
}

function clearActiveTab() {
  const tab = getActiveTab(); if (!tab) return;
  const ta = document.getElementById('ta-'+tab.id); if (!ta) return;
  ta.value = '';
  tab.text = '';
  const vc = document.getElementById('vc-'+tab.id);
  if (vc) vc.textContent = 0;
  setResultsVisible(document.getElementById('results-'+tab.id), false);
}

async function copyActiveTab() {
  const tab = getActiveTab(); if (!tab) return;
  const ta = document.getElementById('ta-'+tab.id); if (!ta) return;
  try { await navigator.clipboard.writeText(ta.value); showToast('Copiado'); } catch(e) {}
}

function analyzeActiveTab() {
  const tab = getActiveTab(); if (!tab) return;
  const ta = document.getElementById('ta-'+tab.id); if (!ta) return;
  analyzePoem();
}

/* ── Sidebar ─────────────────────────────────────────────── */
let sortMode = 'date';

function setSortMode(mode) {
  sortMode = mode;
  document.getElementById('sort-date').classList.toggle('active', mode==='date');
  document.getElementById('sort-az').classList.toggle('active', mode==='az');
  renderSidebar();
}

function newPoem() {
  closeSidebar();
  const tab = openNewTab(null);
  createTabPanel(tab);
  activateTab(tab.id);
  // Ask for name after panel is created
  setTimeout(() => forceNameThenSave(tab), 50);
}

function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  if (!list) return;
  let poems = getSavedPoems();
  if (sortMode === 'az') poems = [...poems].sort((a,b)=>a.name.localeCompare(b.name,'es'));
  else poems = [...poems].sort((a,b)=>new Date(b.date)-new Date(a.date));

  if (!poems.length) {
    list.innerHTML = '<div class="sidebar-empty">No hay poemas guardados aún.<br>Haz clic en <strong>Nuevo poema</strong> para comenzar.</div>';
    return;
  }

  const now = new Date();
  const activeTab = getActiveTab();
  const activePoemId = activeTab && activeTab.poem ? activeTab.poem.id : null;
  list.replaceChildren();

  poems.forEach(p => {
    const d = new Date(p.date);
    const isToday = d.toDateString()===now.toDateString();
    const isYest  = new Date(now-86400000).toDateString()===d.toDateString();
    const dateStr = isToday ? 'Hoy, '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')
                  : isYest  ? 'Ayer'
                  : d.getDate()+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]+' '+d.getFullYear();
    const card = document.createElement('div');
    card.className = 'sidebar-card' + (p.id==activePoemId ? ' active' : '');
    card.addEventListener('click', () => loadPoem(p.id));

    const top = document.createElement('div');
    top.className = 'sidebar-card-top';

    const title = document.createElement('span');
    title.className = 'sidebar-card-title';
    title.textContent = p.name;

    const deleteButton = document.createElement('button');
    deleteButton.className = 'sidebar-card-del';
    deleteButton.type = 'button';
    deleteButton.title = 'Eliminar';
    deleteButton.setAttribute('aria-label', `Eliminar ${p.name}`);
    deleteButton.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 1.75V3h2.25a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1 0-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75ZM4.496 6.675l.66 6.6a.25.25 0 0 0 .249.225h5.19a.25.25 0 0 0 .249-.225l.66-6.6a.75.75 0 0 1 1.492.149l-.66 6.6A1.748 1.748 0 0 1 10.595 15h-5.19a1.75 1.75 0 0 1-1.741-1.576l-.66-6.6a.75.75 0 1 1 1.492-.149Z"/></svg>';
    deleteButton.addEventListener('click', event => {
      event.stopPropagation();
      deletePoemDirect(p.id);
    });

    const sub = document.createElement('div');
    sub.className = 'sidebar-card-sub';
    sub.textContent = 'Última edición: ' + dateStr;

    top.append(title, deleteButton);
    card.append(top, sub);
    list.appendChild(card);
  });
}

async function deletePoemDirect(id) {
  const poem = getSavedPoems().find(p=>p.id==id);
  if (!poem) return;
  if (!confirm('¿Eliminar "' + poem.name + '"?')) return;
  const deleted = await deletePoemFromStorage(id);
  if (!deleted) return;
  // Close tab if this poem is open
  const openTab = tabs.find(t=>t.poem && t.poem.id==id);
  if (openTab) closeTab(openTab.id);
  showToast('Eliminado: ' + poem.name);
}

/* ── File System Access (carpeta local) ──────────────────── */
let dirHandle = null;
const supportsFS = 'showDirectoryPicker' in window;

async function chooseFolder() {
  if (!supportsFS) { showToast('Tu navegador no soporta esta función (usa Chrome/Edge en PC o Safari en Mac)'); return; }
  try {
    dirHandle = await window.showDirectoryPicker({ id: 'verbium-poems', mode: 'readwrite' });
    window._folderPoems = [];
    updateFolderUI();
    await syncFolderPoems();
  } catch (e) { /* user cancelled */ }
}

function updateFolderUI() {
  const btn = document.getElementById('btn-choose-folder');
  if (btn) {
    if (!supportsFS) { btn.style.display = 'none'; }
    else {
      const label = btn.querySelector('.folder-label');
      const labelText = dirHandle ? dirHandle.name : 'Elegir carpeta';
      if (label) label.textContent = labelText;
      btn.setAttribute('aria-label', dirHandle ? 'Carpeta seleccionada: ' + dirHandle.name : 'Elegir carpeta');
      btn.title = dirHandle ? 'Guardando en: ' + dirHandle.name : 'Elige una carpeta de tu PC';
    }
  }
  // Update footer folder display
  const footerFolder = document.getElementById('footer-folder');
  const footerName = document.getElementById('footer-folder-name');
  if (footerFolder && footerName) {
    if (dirHandle) {
      footerName.textContent = dirHandle.name;
      footerFolder.style.display = 'inline';
    } else {
      footerFolder.style.display = 'none';
    }
  }
}

async function syncFolderPoems() {
  if (!dirHandle) return;
  try {
    const poems = [];
    for await (const [filename, handle] of dirHandle.entries()) {
      if (handle.kind === 'file' && filename.endsWith('.txt')) {
        const file = await handle.getFile();
        const text = await file.text();
        poems.push({ id: filename, name: filename.replace(/\.txt$/,''), text, date: new Date(file.lastModified).toISOString(), fromFolder: true });
      }
    }
    poems.sort((a,b) => new Date(b.date) - new Date(a.date));
    window._folderPoems = poems;
    renderSidebar();
    showToast('Carpeta cargada: ' + poems.length + ' poemas');
  } catch (e) { showToast('Error leyendo carpeta'); }
}

const CONTRACTIONS = new Map([
  ["d'el",["de","el"]],["d'él",["de","él"]],["pa'que",["para","que"]],
  ["pa'",["para"]],["pal",["para","el"]],["p'al",["para","el"]],
  ["p'alla",["para","alla"]],["pa'lla",["para","alla"]],
  ["pa'cá",["para","acá"]],["pa'ca",["para","aca"]]

/* ── Helpers ────────────────────────────────────────────── */
const isVowel  = ch => !!ch && VOWELS.has(ch);
const isWeak   = ch => !!ch && WEAK.has(ch);
const isStrong = ch => !!ch && STRONG.has(ch);

const stripVC  = s  => s.replace(/[^a-záéíóúüñ]/gi,'');

function expandContraction(word) {
  return CONTRACTIONS.get(word.toLowerCase()) ?? null;
}

/* ── Syllable cache ─────────────────────────────────────── */
const MAX_CACHE = 500;
const sylCache  = new Map();
function syllabifyCached(word) {
  if (sylCache.has(word)) return sylCache.get(word);
  const r = syllabify(word);
  if (sylCache.size >= MAX_CACHE) sylCache.delete(sylCache.keys().next().value);
  sylCache.set(word, r);
  return r;
}

/* ── Word-type checks ───────────────────────────────────── */
function isNumber(word) {
  const c = word.replace(STRIP_PUNCT,'').trim();
  if (!c) return false;

  if (/^(M{0,3})(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})$/i.test(c) && c.length > 0) {
    return !COMMON_WORDS.has(c.toLowerCase());
  }
  return false;
}
function romanToInteger(roman) {
  const values={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
  let total=0;
  for(let i=0;i<roman.length;i++) total+=(values[roman[i]]||0)<(values[roman[i+1]]||0)?-values[roman[i]]:values[roman[i]];
  return total;
}
function integerToSpanish(value) {
  const units=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const tens=['','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const hundreds=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  if(value<30) return units[value];
  if(value<100) return tens[Math.floor(value/10)]+(value%10?' y '+units[value%10]:'');
  if(value===100) return 'cien';
  if(value<1000) return hundreds[Math.floor(value/100)]+(value%100?' '+integerToSpanish(value%100):'');
  if(value<1000000) {
    const thousands=Math.floor(value/1000),rest=value%1000;
    return (thousands===1?'mil':integerToSpanish(thousands)+' mil')+(rest?' '+integerToSpanish(rest):'');
  }
  return null;
}
function spokenNumberWords(word) {
  const c=word.replace(STRIP_PUNCT,'').trim();
  const value=/^\d+$/.test(c)?Number(c):romanToInteger(c.toUpperCase());
  if(!Number.isSafeInteger(value)||value<0||value>=1000000) return null;
  const spoken=integerToSpanish(value);
  return spoken?spoken.split(/\s+/).filter(Boolean):null;
}
const numberToSyls = word => {
  const words=spokenNumberWords(word);
  return words?words.flatMap(item=>syllabifyCached(item)):[word.replace(STRIP_PUNCT,'').trim()];
};
const isYFinal     = word => { const c=word.replace(STRIP_PUNCT,'').toLowerCase().trim(); return c.length>1&&/[aeiouáéíóúü]y$/i.test(c); };

/* ── Diphthong check ────────────────────────────────────── */
function isDiphthong(v1, v2, wordClean, nextChar) {
  // RAE exception: ẅ (gü digraph) + accented vowel = diphthong (lingüística)
  if (v1 === 'ẅ' && WEAK_ACCENT.has(v2)) return true;
  // RAE exception: ŵ (silent u in qu/gu) + any vowel = diphthong (aquí, equívoco, esquí)
  if (v1 === 'ŵ') return true;
  // RAE rule: two identical vowels = always hiato (antiinflamatorio, coordinación)
  if (v1 === v2) return false;
  // Dos cerradas forman diptongo ortográfico incluso si la segunda recibe
  // la tilde exigida por la palabra: cuí-da-te, ben-juí, in-ter-viú.
  const closed = ch => /[iuüíú]/.test(ch);
  if (closed(v1) && closed(v2)) return true;
  if (WEAK_ACCENT.has(v1) || WEAK_ACCENT.has(v2)) return false;
  if (isStrong(v1) && isStrong(v2)) return false;
  if (nextChar === 'h') return true;
  if (isWeak(v1) && isWeak(v2)) return true;
  return (isWeak(v1) && isStrong(v2)) || (isStrong(v1) && isWeak(v2));
}

/* ── Core syllabifier ───────────────────────────────────── */
function syllabify(word) {
  let clean = word.replace(STRIP_PUNCT,'').toLowerCase().trim();
  if (!clean) return [];
  if (SYLLABLE_LEXICON.has(clean)) return [...SYLLABLE_LEXICON.get(clean)];
  const expanded = expandContraction(clean);
  if (expanded)          return expanded;
  if (isNumber(clean))   return numberToSyls(clean);
  const wordClean = clean.replace(/[ŵẅ]/g,'u').replace(/ü/g,'u');
  clean = clean.replace(/qu([eéiíoóuúaá])/g,'qŵ$1').replace(/gu([eéiíoóuúaá])/g,'gŵ$1').replace(/gü/g,'gẅ');
  const L = [...clean], N = L.length;
  let pos = 0;
  const syls = [];
  while (pos < N) {
    let syl = '';
    while (pos < N && !isVowel(L[pos])) syl += L[pos++];
    if (pos >= N) { if (syl) (syls.length ? syls[syls.length-1] += syl : syls.push(syl)); break; }
    syl += L[pos++];
    let la = pos;
    while (la < N && L[la] === 'h') la++;
    // Only bridge h for diphthong if h is truly intervocalic
    // (i.e. the char before the current vowel is not a consonant that suggests h belongs to next onset)
    const hIsBridge = (la === pos) || (pos >= 2 && isVowel(L[pos-2]));
    if (la < N && isVowel(L[la]) && hIsBridge) {
      if (isDiphthong(L[pos-1], L[la], wordClean, L[la-1])) {
        while (pos < la) syl += L[pos++];
        syl += L[pos++];
        // Triptongo check: add trailing weak vowel
        if (pos < N && isVowel(L[pos]) && isWeak(L[pos]) && !WEAK_ACCENT.has(L[pos])) syl += L[pos++];
        // Special case: after qŵ/gŵ onset, 'i'+'e/a/o' forms diphthong (quien, quiero, guia)
        else if (pos < N && isVowel(L[pos]) && isStrong(L[pos]) && syl.match(/^[qg]ŵ.*[iu]$/)) syl += L[pos++];
      }
    }
    const cs = pos;
    while (pos < N && !isVowel(L[pos])) pos++;
    const cons = L.slice(cs, pos);
    if (!cons.length)   { syls.push(syl); }
    else if (pos >= N)  { syls.push(syl + cons.join('')); }
    else {
      const sp = cons.length <= 1 ? 0 : (ONSET_CLUSTERS.has(cons.slice(-2).join('')) ? cons.length-2 : cons.length-1);
      syls.push(syl + cons.slice(0,sp).join(''));
      pos = cs + sp;
    }
  }
  return (syls.length ? syls : [clean]).map(s => {
    const isTriphthong = s.includes('ẅ');
    const restored = s.replace(/ŵ/g,'u').replace(/ẅ/g,'ü');
    return restored;
  });
}

/* ── Tonic index ────────────────────────────────────────── */
function defaultStressIndex(clean, syllableCount) {
  if (syllableCount <= 1) return 0;
  const last = clean.slice(-1);
  const previous = clean.slice(-2,-1);
  const consonantBeforeNS = /[ns]/.test(last) && previous && !/[aeiouáéíóúü]/.test(previous);
  return /[aeiouáéíóúüns]/.test(last) && !consonantBeforeNS ? syllableCount-2 : syllableCount-1;
}

function resolveTonicity(clean, context=null) {
  const words=context?.words || [];
  const index=Number.isInteger(context?.index) ? context.index : -1;
  const normalize=value=>(value||'').replace(STRIP_PUNCT,'').toLowerCase();
  const previous=index>0 ? normalize(words[index-1]) : '';
  const next=index>=0&&index<words.length-1 ? normalize(words[index+1]) : '';
  const decision=(atonic,confidence,status,reason)=>({atonic,confidence,status,reason});
  if (!clean) return decision(false,'bajo','requiere_desambiguacion','Forma vacía');
  if (PROSODIC_EMPHASIS.has(clean)) return decision(false,'alto','resuelta','Énfasis prosódico declarado por el usuario');
  if (/[áéíóú]/.test(clean)) return decision(false,'alto','resuelta','Tilde escrita');
  if (TONIC_FUNCTION_WORDS.has(clean)) return decision(false,'alto','resuelta','Excepción funcional tónica');
  if (ATONIC_ARTICLES.has(clean)) return decision(true,'alto','resuelta','Artículo');
  if (ATONIC_CLITICS.has(clean)) return decision(true,'alto','resuelta','Pronombre clítico');
  if (clean==='si') {
    if (ATONIC_ARTICLES.has(previous)||previous==='nota') return decision(false,'alto','resuelta','Nombre de nota musical');
    return decision(false,'bajo','requiere_desambiguacion','Conjunción condicional o nota musical');
  }
  if ((clean==='cual'||clean==='cuales')&&ATONIC_ARTICLES.has(previous))
    return decision(false,'alto','resuelta','Relativo cual/cuales precedido de artículo');
  if (CONTEXTUAL_RELATIVES.has(clean)) {
    if (clean==='que') return decision(true,'alto','resuelta','Relativo o conjunción que');
    if (clean==='como'&&SUBJECT_PRONOUNS.has(previous)) return decision(false,'medio','resuelta','Posible forma verbal');
    if (ATONIC_ARTICLES.has(previous)) return decision(false,'bajo','requiere_desambiguacion','Posible sustantivación');
    return decision(false,'bajo','requiere_desambiguacion','Relativo sin tilde de tonicidad dependiente de construcción');
  }
  if (CONTEXTUAL_POSSESSIVES.has(clean)) {
    if (!next||ATONIC_ARTICLES.has(previous)||previous==='nota') return decision(false,'medio','resuelta','Uso pospuesto, pronominal o nominal probable');
    return decision(false,'bajo','requiere_desambiguacion','Posesivo determinante o uso tónico');
  }
  if (CONTEXTUAL_INDEFINITES.has(clean)) {
    if (!next) return decision(false,'medio','resuelta','Uso pronominal o numeral probable');
    return decision(false,'bajo','requiere_desambiguacion','Determinante o pronombre indefinido');
  }
  if (CONTEXTUAL_PREPOSITIONS.has(clean))
    return decision(false,'medio','resuelta','Preposición con tonicidad propia probable');
  if (PREPOSITION_HOMOGRAPHS.has(clean)) {
    if (SUBJECT_PRONOUNS.has(previous)||ATONIC_ARTICLES.has(previous)||previous==='no')
      return decision(false,'medio','resuelta','Uso verbal, nominal o adjetival probable');
    return next?decision(true,'medio','resuelta','Uso preposicional probable'):
      decision(false,'bajo','requiere_desambiguacion','Homógrafo preposicional o léxico');
  }
  if (ATONIC_PREPOSITIONS.has(clean)) return decision(true,'alto','resuelta','Preposición átona por defecto');
  if (ATONIC_CONJUNCTIONS.has(clean)) return decision(true,'alto','resuelta','Conjunción o nexo átono por defecto');
  return decision(false,'medio','resuelta','Inferencia ortográfica sin confirmación léxica');
}

function isMenteAdverb(clean) {
  if (!clean.endsWith('mente')||MENTE_NON_ADVERBS.has(clean)||clean.length<=7) return false;
  const base=clean.slice(0,-5);
  return /[aeiouáéíóúü]/.test(base)&&syllabifyCached(base).length>0;
}

function numberTonicIndices(word) {
  const words=spokenNumberWords(word);
  if(!words) return [0];
  const indices=[];
  let offset=0;
  for(const part of words) {
    const syllables=syllabifyCached(part);
    if(part!=='y') {
      const written=syllables.findIndex(syllable=>/[áéíóú]/.test(syllable));
      indices.push(offset+(written>=0?written:defaultStressIndex(part,syllables.length)));
    }
    offset+=syllables.length;
  }
  return indices;
}

function lexicalTonicData(word, context=null) {
  const clean = word.replace(STRIP_PUNCT,'').toLowerCase().trim();
  if (!clean) return {indices:[0],decision:{atonic:false,confidence:'bajo',status:'requiere_desambiguacion',reason:'Forma vacía'}};
  if (isNumber(clean)) return {indices:numberTonicIndices(clean),decision:{atonic:false,confidence:spokenNumberWords(clean)?'medio':'bajo',status:spokenNumberWords(clean)?'resuelta':'requiere_desambiguacion',reason:'Lectura numérica inferida'}};
  let decision=resolveTonicity(clean,context);
  if (decision.atonic) return {indices:[],decision};
  const syls = syllabifyCached(clean), n = syls.length;
  if (!n) return {indices:[0],decision};
  if (LEXICAL_STRESS.has(clean)) return {indices:[LEXICAL_STRESS.get(clean)],decision:{...decision,confidence:'alto',reason:'Entrada léxica'}};
  if (isMenteAdverb(clean) && n >= 2) {
    const base = clean.slice(0,-5);
    const baseSyls = syllabifyCached(base);
    const baseWritten = baseSyls.findIndex(s=>/[áéíóú]/.test(s));
    const baseStress = baseWritten >= 0 ? baseWritten : defaultStressIndex(base,baseSyls.length);
    return {indices:[...new Set([baseStress,n-2])].filter(i=>i>=0&&i<n),decision:{...decision,confidence:'medio',reason:'Adverbio en -mente inferido morfológicamente'}};

      compound.left.finalAdjustment.confidence==='medio'||compound.right.finalAdjustment.confidence==='medio'?'medio':'alto'};

function automaticScansionScore(result, policy) {
  if (!result) return Number.NEGATIVE_INFINITY;
  let score=0;
  const confidenceValue={alto:3,medio:2,bajo:0};
  score+=(confidenceValue[result.globalConfidence]||0)*2;
  score-=result.criticalAmbiguities.length*2;
  if (result.count===14 && result.isCompound) score+=12;
  else if (result.count===11 && result.tonicMap?.[9]) score+=9;
  else if (result.count===8 && result.tonicMap?.[6]) score+=8;
  else if ([7,9,10,12].includes(result.count)) score+=4;
  // En igualdad lingüística se conserva la unión normativa, sin forzar la medida.
  if (policy==='normativa') score+=0.1;
  return score;
}

function analyzeLine(line) {
  const previous=METRIC_OPTIONS.sinalefaPolicy;
  METRIC_OPTIONS.sinalefaPolicy='normativa';
  const normative=analyzeLineForPolicy(line);
  METRIC_OPTIONS.sinalefaPolicy='conservadora';
  const conservative=analyzeLineForPolicy(line);
  METRIC_OPTIONS.sinalefaPolicy=previous;
  if (!normative) return conservative;
  if (!conservative) return normative;
  const normativeScore=automaticScansionScore(normative,'normativa');
  const conservativeScore=automaticScansionScore(conservative,'conservadora');
  const chosen=conservativeScore>normativeScore?conservative:normative;
  const alternate=chosen===normative?conservative:normative;
  chosen.sinalefaPolicySelected=chosen===normative?'normativa':'conservadora';
  if (alternate.count!==chosen.count && !chosen.alternativeScansions.some(item=>item.count===alternate.count)) {
    chosen.alternativeScansions.push({count:alternate.count,cause:'LECTURA_AUTOMATICA_ALTERNATIVA',changes:[`Lectura ${chosen===normative?'conservadora':'normativa'}`]});
    chosen.alternativeScansions.sort((a,b)=>a.count-b.count);
  }
  return chosen;
}

    consonant:[...part].map(unaccent).join(''),
    assonant: [...part].filter(ch=>VOWELS.has(ch)).map(unaccent).join('')

function assignRhymes(results) {
  const consMap={}, assoMap={};
  let counter=0;
  for (const r of results.filter(Boolean)) {
    const {consonant,assonant}=getRhymeSounds(r.words[r.words.length-1]);
    if (!consonant) { r.rhymeLabel='—'; r.rhymeType=''; continue; }
    if (consMap[consonant]!==undefined) {
      r.rhymeLabel=consMap[consonant]; r.rhymeType='c';
    } else if (assoMap[assonant]!==undefined) {
      const l=assoMap[assonant];
      consMap[consonant]=l;

    } else {
      const l=LETTERS[counter++%26];
      consMap[consonant]=l; assoMap[assonant]=l;
      r.rhymeLabel=l; r.rhymeType='c';
    }
  }

function primaryDivisionText(result) {

  }).join('');
  const head='<div class="scan-primary-head"><span>División silábica</span><span>Sílabas</span><span>Patrón de rima</span></div>';
  target.innerHTML=`<h2>División en sílabas y patrón de rimas</h2><div class="scan-primary-pattern">Patrón general: ${escHtml(pattern)}</div>${head}<div class="scan-primary-list">${rows||'<div class="scan-primary-row"><span>No se encontraron versos analizables.</span></div>'}</div>`;
}


/* ── State ──────────────────────────────────────────────── */
const $ = id => document.getElementById(id);

/* ── Main analyze ───────────────────────────────────────── */
function analyzePoem() {
  const tab = getActiveTab();
  const tid = tab ? tab.id : null;
  const taEl = tid ? document.getElementById('ta-'+tid) : null;
  const raw = taEl ? taEl.value : '';
  const resultsEl = tid ? document.getElementById('results-'+tid) : null;
  if (!raw.trim()) { setResultsVisible(resultsEl, false); return; }
  const text = cleanPoemText(raw);

  const results = text.split('\n').map(line => {
    if (!line.trim()) return null;
    const r = analyzeLine(line);
    if (!r) return null;
    const sinAll=[], dieAll=[];
    let offset=0;
    for (const word of r.wordSyllables) {
      word.sineresis.forEach(pos => sinAll.push(offset+pos));
      word.dieresis.forEach( pos => dieAll.push(offset+pos));
      offset += word.syllables.length;
    }
    return {...r, line, sineresisMarks:sinAll, dieresisMarks:dieAll};
  });

  const valid = results.filter(Boolean);
  if (!valid.length) { setResultsVisible(resultsEl, false); return; }

  assignRhymes(results);

  /* Stats */
  const counts   = valid.map(r => r.count);
  const total    = valid.length;
  const totalSyl = counts.reduce((a,b)=>a+b,0);
  const avg      = (totalSyl/total).toFixed(1);
  const dominant = [...new Set(counts)].sort((a,b)=>counts.filter(x=>x===b).length-counts.filter(x=>x===a).length)[0];
  const isIso    = new Set(counts).size === 1;
  const patron   = isIso ? 'Regular' : 'Irregular';
  const tendencia= VERSE_NAMES[dominant] ? VERSE_NAMES[dominant].replace('ílabo','').replace('ísílabo','') : dominant+' síl.';
  const rhymePatternReadable = valid.map(r => r.rhymeLabel||'—').join(' · ');
  renderPrimaryScan(results,'sv-'+tid);

  document.getElementById('mg-'+tid).innerHTML=`
    <div class="metric-card"><div class="metric-value">${avg}</div><div class="metric-label">Promedio</div></div>
    <div class="metric-card"><div class="metric-value">${patron}</div><div class="metric-label">Patrón</div></div>
    <div class="metric-card"><div class="metric-value">${tendencia}</div><div class="metric-label">Tendencia</div></div>`;
  const rhymePatternEl=document.getElementById('rp-'+tid);
  if (rhymePatternEl) rhymePatternEl.textContent=rhymePatternReadable||'—';

  /* Chart */
  const maxBar = Math.max(...counts, 1);
  const barHeight = 180;
  function detectRitmoBar(tonicMap,count,tonicDetails=[]) {
    const mm = Array.isArray(tonicMap) ? tonicMap : Object.keys(tonicMap).map(Number).sort((a,b)=>a-b).map(i=>!!tonicMap[i]);
    const has = n => n>=1 && n<=mm.length && mm[n-1]===true;
    const t = mm.map((v,i)=>v?i+1:null).filter(Boolean);
    if (!t.length) return 'Sin apoyos';
    function score(req,bon=[],forb=[]) {
      if (req.some(n=>!has(n))) return Number.NEGATIVE_INFINITY;
      let s=req.length*3;
      for (const n of bon) s+=has(n)?1:0;
      for (const n of forb) s+=has(n)?-2:0;
      return s;
    }
    function qualifiedLabel(label,required) {
      const supports=required.map(position=>tonicDetails[position-1]).filter(Boolean);
      if(supports.some(item=>item.requiresDisambiguation||item.confidence==='bajo')) return `Posible ${label}`;
      if(supports.some(item=>item.confidence==='medio')) return `Probable ${label}`;
      return label;
    }
    if (count===11) {
      const patterns = {
        'Heroico':{required:[2,6,10],score:score([2,6,10],[4,8],[3,5])},
        'Melódico':{required:[3,6,10],score:score([3,6,10],[5],[2,4])},
        'Sáfico':{required:[4,8,10],score:score([4,8,10],[6],[2,3])},
        'Enfático':{required:[1,6,10],score:score([1,6,10],[4],[2,3,5])}
      };
      const best=Object.entries(patterns).sort((a,b)=>b[1].score-a[1].score)[0];
      if(best[1].score>0) return qualifiedLabel(best[0],best[1].required);
      return `Endecasílabo ${t.join('·')}`;
    }
    if (count===8) {
      const patterns={
        'Trocaico':{required:[3,7],score:score([3,7],[1,5],[2,4,6])},
        'Dactílico':{required:[1,4,7],score:score([1,4,7],[2,5],[3,6])},
        'Mixto A':{required:[2,4,7],score:score([2,4,7],[6],[1,3,5])},
        'Mixto B':{required:[2,5,7],score:score([2,5,7],[3],[1,4,6])}
      };
      const best=Object.entries(patterns).sort((a,b)=>b[1].score-a[1].score)[0];
      return best[1].score>0?qualifiedLabel(best[0],best[1].required):`Octosílabo ${t.join('·')}`;
    }
    return `Apoyos ${t.join('·')}`;
  }
  document.getElementById('bc-'+tid).innerHTML = valid.map((r,i) => {
    const h = Math.round(r.count/maxBar*barHeight);
    const isRegular = r.count === 8 || r.count === 11;
    const barColor = isRegular ? '#15803d' : '#b8922a';
    const ritmo=detectRitmoBar(r.tonicMap,r.count,r.tonicDetails);
    const measureLabel=r.isCompound?`${r.hemistichs[0].count}+${r.hemistichs[1].count}`:`${r.count}`;
    const alternatives=r.alternativeScansions.length?` — alternativas ${r.alternativeScansions.map(item=>item.count).join('/')}`:'';
    const RITMO_COLORS = {'Heroico':'#8b3a0f','Melódico':'#15803d','Sáfico':'#1d4ed8','Enfático':'#0369a1','Trocaico':'#7e22ce','Dactílico':'#be123c','Mixto A':'#b45309','Mixto B':'#0f766e'};
    const ritmoColor = RITMO_COLORS[ritmo] || 'rgba(28,26,22,.4)';
    return `<div class="bar-item">
      <div class="bar-top-num" style="color:${barColor}">${measureLabel}</div>
      <div class="bar-area"><div class="bar-fill" style="height:${h}px;background:${barColor}" title="Verso ${i+1}: ${measureLabel} sílabas${alternatives} — ${ritmo} — métrica ${r.metricConfidence} — ritmo ${r.rhythmicConfidence}${r.requiresDisambiguation?' — requiere revisión':''}"></div></div>
      <div class="bar-lbl" style="color:${ritmoColor};font-weight:600">${ritmo}</div>
    </div>`;
  }).join('');

  /* Table */
  const tbody = document.getElementById('rb-'+tid);
  tbody.innerHTML = '';
  let rowNum = 0;
  for (const r of results) {
    const tr = document.createElement('tr');
    if (!r) {
      tr.style.cssText='background:var(--border)';
      tr.innerHTML=`<td colspan="5" style="padding:.2rem;border-bottom:1px solid var(--border)"></td>`;
      tbody.appendChild(tr); continue;
    }
    rowNum++;
    tr.className = REGULAR_COUNTS.has(r.count) ? 'verse-regular' : 'verse-irregular';
    const sign = STRESS_SIGN[r.stress]
      ? `<span style="font-size:.58rem;font-weight:700;vertical-align:super;color:${STRESS_COLOR[r.stress]}">${STRESS_SIGN[r.stress]}</span>`
      : '';
    const confidenceLabel=`M:${r.metricConfidence} · R:${r.rhythmicConfidence}`;
    const alternativeLabel=r.alternativeScansions.length?`alt. ${r.alternativeScansions.map(item=>item.count).join('/')}`:'';
    const countLabel=r.isCompound?`${r.hemistichs[0].count}+${r.hemistichs[1].count}`:`${r.count}`;
    tr.innerHTML=`
      <td class="td-num"      data-label="#">${rowNum}</td>
      <td class="td-original" data-label="Verso">${escHtml(r.line)}</td>
      <td class="td-divided"  data-label="División">${renderDivided(r.sylData,r.cesuraIdx,r.tonicMap,r.sineresisMarks,r.dieresisMarks)}</td>
      <td class="td-count"    data-label="Sílabas" title="${r.adjustmentCause}; confianza global ${r.globalConfidence}${r.requiresDisambiguation?'; requiere revisión de alternativas':''}"><span class="count-num">${countLabel}</span>${sign}${alternativeLabel?`<small style="display:block;color:var(--rust);font-size:.58rem;margin-top:3px">${alternativeLabel}</small>`:''}<small style="display:block;color:var(--ink50);font-size:.55rem;margin-top:3px">${confidenceLabel}</small></td>
      <td class="td-type"     data-label="Rima"><span style="font-size:1rem;font-weight:600;color:var(--rust)">${r.rhymeLabel||'—'}${r.rhymeLabel&&r.rhymeLabel!=='—'?`<sup style="font-size:.55rem;font-weight:500;color:var(--ink50)">${r.rhymeType||''}</sup>`:''}</span></td>`;
    tbody.appendChild(tr);
  }

  setResultsVisible(resultsEl, true);
  // Presenta primero el resumen, la división silábica y las rimas; el gráfico queda después.
  if (resultsEl) resultsEl.scrollTop=0;
}

/* ── Storage ────────────────────────────────────────────── */
function normalizePoem(poem, index=0) {
  if (!poem || typeof poem !== 'object') return null;
  const rawText = poem.text ?? poem.content ?? poem.body ?? poem.value ??
    (typeof poem.poem === 'string' ? poem.poem : '');
  const rawName = poem.name ?? poem.title ?? poem.filename ?? `Poema ${index + 1}`;
  const rawId = poem.id ?? poem.key ?? `legacy-${index}-${String(rawName)}`;
  const rawDate = poem.date ?? poem.updatedAt ?? poem.createdAt ?? new Date(0).toISOString();
  const date = Number.isNaN(new Date(rawDate).getTime()) ? new Date(0).toISOString() : rawDate;
  return {
    ...poem,
    id: rawId,
    name: String(rawName),
    text: typeof rawText === 'string' ? rawText : String(rawText ?? ''),
    date
  };
}

function readLocalPoems() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return Array.isArray(stored) ? stored.map(normalizePoem).filter(Boolean) : [];
  } catch {
    return [];
  }
}

function writeLocalPoems(poems) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(poems.slice(0, 50)));
    return true;
  } catch {
    showToast('No se pudo guardar en el navegador');
    return false;
  }
}

function upsertLocalBackup(poem, previousId=null) {
  const poems = readLocalPoems();
  const index = poems.findIndex(item =>
    item.id == poem.id ||
    (previousId != null && item.id == previousId) ||
    item.name.toLocaleLowerCase('es') === poem.name.toLocaleLowerCase('es')
  );
  if (index >= 0) poems.splice(index, 1);
  poems.unshift(poem);
  return writeLocalPoems(poems);
}

const getSavedPoems = () => {
  if (dirHandle && Array.isArray(window._folderPoems)) {
    return window._folderPoems.map(normalizePoem).filter(Boolean);
  }
  return readLocalPoems();
};

async function deletePoemFromStorage(id) {
  let folderDeleted = true;
  if (dirHandle && typeof id === 'string') {
    try {
      await dirHandle.removeEntry(id);
      await syncFolderPoems();
    } catch {
      folderDeleted = false;
      showToast('No se pudo eliminar el archivo de la carpeta');
    }
  }
  const localPoems = readLocalPoems().filter(poem => poem.id != id);
  const localDeleted = writeLocalPoems(localPoems);
  renderSidebar();
  return folderDeleted && localDeleted;
}

function loadPoem(id) {
  closeSidebar();
  const poem = getSavedPoems().find(p=>p.id==id);
  if (!poem) return;
  // Check if already open in a tab
  const existing = tabs.find(t=>t.poem && t.poem.id==id);
  if (existing) {
    if (!existing.dirty) {
      existing.poem = poem;
      existing.name = poem.name;
      existing.text = poem.text;
      const textarea = document.getElementById('ta-'+existing.id);
      if (textarea) textarea.value = poem.text;
      const verseCount = document.getElementById('vc-'+existing.id);
      if (verseCount) verseCount.textContent = poem.text.split('\n').filter(line=>line.trim()).length;
    }
    activateTab(existing.id);
    return;
  }
  // Open in new tab
  const tab = openNewTab(poem);
  createTabPanel(tab);
  activateTab(tab.id);
  showToast(`Cargado: ${poem.name}`);
}

/* ── Modal system (Editorium style) ─────────────────────── */
const GENERIC_NAMES = ['sin título','sin titulo','untitled','nuevo','new','nota','note','poema','poem',''];

function isGenericName(name) {
  return GENERIC_NAMES.includes(name.trim().toLowerCase().replace(/\.txt$/,''));
}

function openVbModal(html, onConfirm) {
  const box = $('vb-modal-box');
  const overlay = $('vb-overlay');
  box.innerHTML = html;
  overlay.classList.remove('hidden');

  function tryConfirm() {
    const result = onConfirm();
    if (result && typeof result.then === 'function') {
      const okBtn = box.querySelector('[data-ok]');
      if (okBtn) okBtn.disabled = true;
      result.then(r => {
        if (okBtn) okBtn.disabled = false;
        if (r !== false) closeVbModal();
      }).catch(() => { if (okBtn) okBtn.disabled = false; });
    } else if (result !== false) {
      closeVbModal();
    }
  }

  const cancelBtn = box.querySelector('[data-cancel]');
  const okBtn = box.querySelector('[data-ok]');
  if (cancelBtn) cancelBtn.addEventListener('click', closeVbModal);
  if (okBtn) okBtn.addEventListener('click', tryConfirm);
  box.onkeydown = e => {
    if (e.key === 'Enter' && e.target.tagName !== 'SELECT' && okBtn) { e.preventDefault(); tryConfirm(); }
    if (e.key === 'Escape') closeVbModal();
  };
  const firstInput = box.querySelector('input');
  if (firstInput) { firstInput.focus(); firstInput.select(); }
}

function closeVbModal() {
  $('vb-overlay').classList.add('hidden');
}

function alertVbModal(msg) {
  return new Promise(resolve => {
    openVbModal(
      `<h2 style="margin-bottom:12px">Aviso</h2><p style="color:var(--ink50);margin-bottom:20px">${msg}</p><div class="modal-actions"><button data-ok class="btn-primary">Entendido</button></div>`,
      () => { resolve(); return true; }
    );
  });
}

/* ── Save system ─────────────────────────────────────────── */
async function saveActiveTab() {
  const tab = getActiveTab();
  if (!tab) return;
  const ta = document.getElementById('ta-'+tab.id);
  if (!ta || !ta.value.trim()) { showToast('No hay poema para guardar'); return; }
  tab.text = ta.value;

  // Already saved and linked to storage → overwrite directly
  if (tab.poem) {
    await writePoemToStorage(tab, tab.poem.name, tab.text);
    return;
  }

  // New tab → force name
  forceNameThenSave(tab);
}

function forceNameThenSave(tab) {
  const prefill = isGenericName(tab.name) ? '' : escHtml(tab.name);
  openVbModal(
    `<h2 style="margin-bottom:8px">Nombra tu poema</h2>
     <label style="font-size:.8rem;color:var(--ink50);margin-bottom:6px;display:block">Nombre del archivo</label>
     <input type="text" id="vb-name-input" placeholder="ej: soneto-a-la-luna" value="${prefill}" autocomplete="off" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);margin-bottom:6px">
     <div id="vb-name-error" style="color:var(--rust);font-size:.78rem;min-height:18px;margin-bottom:12px"></div>
     <div class="modal-actions">
       <button data-cancel>Cancelar</button>
       <button data-ok class="btn-primary">Guardar</button>
     </div>`,
    async () => {
      const name = document.getElementById('vb-name-input').value.trim();
      if (isGenericName(name)) {
        document.getElementById('vb-name-error').textContent = 'Escribe un nombre específico para tu poema.';
        return false;
      }
      const result = await writePoemToStorage(tab, name, tab.text);
      if (result === 'duplicate') {
        document.getElementById('vb-name-error').textContent = 'Ya existe un poema con este nombre.';
        return false;
      }
      return true;
    }
  );
}

async function writePoemToStorage(tab, name, text) {
  // Save to folder if available
  if (dirHandle) {
    const filename = name.replace(/[\//:*?"<>|]/g,'-') + '.txt';
    try {
      // Check duplicate (only if it's a different file than this tab's current)
      const isNewTarget = !tab.poem || tab.poem.name !== name;
      if (isNewTarget) {
        let exists = false;
        try { await dirHandle.getFileHandle(filename); exists = true; } catch(e) {}
        if (exists) return 'duplicate';
      }
      const fh = await dirHandle.getFileHandle(filename, {create:true});
      const wr = await fh.createWritable();
      await wr.write(text);
      await wr.close();
      // Update tab
      const poem = {id: filename, name, text, date: new Date().toISOString(), fromFolder:true};
      upsertLocalBackup(poem, tab.poem ? tab.poem.id : null);
      tab.name = name; tab.poem = poem; tab.dirty = false;
      await syncFolderPoems();
      showToast('Guardado: ' + name);
      return 'ok';
    } catch(e) {
      await alertVbModal('No se pudo guardar: ' + e.message);
      return 'error';
    }
  }

  // localStorage fallback
  const poems = readLocalPoems();
  const isNewTarget = !tab.poem || tab.poem.name !== name;
  if (isNewTarget) {
    const exists = poems.find(p=>p.name.toLowerCase()===name.toLowerCase());
    if (exists) return 'duplicate';
  }
  const now = new Date().toISOString();
  let poem;
  if (tab.poem && tab.poem.name === name) {
    // Overwrite same poem
    const updated = poems.map(p=>p.id==tab.poem.id?{...p,text,date:now}:p);
    if (!writeLocalPoems(updated)) return 'error';
    poem = {...tab.poem, text, date:now};
  } else {
    // New poem
    poem = {id:Date.now(), name, text, date:now};
    poems.unshift(poem);
    if (poems.length>50) poems.pop();
    if (!writeLocalPoems(poems)) return 'error';
  }
  tab.name = name; tab.poem = poem; tab.dirty = false;
  renderSidebar();
  showToast('Guardado: ' + name);
  return 'ok';
}


/* ── Toast ──────────────────────────────────────────────── */
let toastTimer;
function showToast(msg) {
  const t=$('copy-toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.classList.remove('show'); t.textContent='✓ Copiado al portapapeles'; }, 2200);
}

/* ── Clipboard ──────────────────────────────────────────── */

function cleanPoemText(text) {
  return text.split('\n').map(line => {
    return line
      .replace(/^\s*#+\s*/,'')                            // ### markdown headings
      .replace(/\b\d+\s*[\+\*=]\s*\d+\s*[=\+\*]?\s*\d*\b/g,'')           // math: 7+1=8 3*4=12
      .replace(/^\s*\d+(?=[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ])/,'')  // number glued to word at start
      .replace(/\(\s*\d+\s*\)/g,'')                       // (1) inline
      .replace(/\[\s*\d+\s*\]/g,'')                       // [1] inline
      .replace(/[()[\]]/g,'')                              // remaining parens/brackets
      .replace(/\|/g,'')                                  // pipe characters
      .replace(/-/g,'')                                    // dashes (preserve spaces)
      .replace(/^\s*[-–—]\s*/,'')                         // leading dash after number removal
      .replace(/\s+\d+\s*$/,'')                           // trailing number at end of line
      .replace(/\s{2,}/g,' ')
      .trim();
  })
  .filter(line => line.length > 0)
  .join('\n')
  .trim();
}


/* ── Init ───────────────────────────────────────────────── */
let _debounceTimer = null;

function debounceAnalyze() {
  clearTimeout(_debounceTimer);
  const tab = getActiveTab(); if (!tab) return;
  const ta = document.getElementById('ta-'+tab.id); if (!ta) return;
  const vc = document.getElementById('vc-'+tab.id);
  if (vc) vc.textContent = ta.value.split('\n').filter(l=>l.trim()).length;
  const resultsEl = document.getElementById('results-'+tab.id);
  if (!ta.value.trim()) { setResultsVisible(resultsEl, false); return; }
  _debounceTimer = setTimeout(analyzePoem, 800);
}

$('vb-overlay').addEventListener('click', e => { if(e.target===$('vb-overlay')) closeVbModal(); });



/* ── Mobile sidebar toggle ─────────────────────────────── */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  if (!sb || !ov) return;
  const isOpen = sb.classList.contains('open');
  if (isOpen) { closeSidebar(); }
  else { sb.classList.add('open'); ov.classList.add('show'); document.body.style.overflow = 'hidden'; }
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  if (sb) sb.classList.remove('open');
  if (ov) ov.classList.remove('show');
  document.body.style.overflow = '';
}
/* Close sidebar on window resize to desktop */
window.addEventListener('resize', () => {
  if (window.innerWidth > 768) closeSidebar();
});


window.onload = () => {
  updateFolderUI();
  renderSidebar();
};
